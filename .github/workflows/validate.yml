name: Validate source and release artifacts

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      PYTHON_VERSION: ${{ matrix.python-version }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          enable-cache: true
          version: "0.12.3"

      - name: Set up Python
        run: uv python install "$PYTHON_VERSION"

      - name: Install locked validation dependencies
        run: uv sync --locked --python "$PYTHON_VERSION" --extra semgrep --extra ui --extra api --dev

      - name: Run Ruff linter and formatting
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .

      - name: Run Mypy type checking
        run: uv run --no-sync mypy agentscan

      - name: Run tests and action boundary regressions
        run: uv run --no-sync pytest tests .github/tests -m "not slow" --cov=agentscan --cov-report=xml

      - name: Audit locked dependencies (required)
        run: |
          set -euo pipefail
          uv export --frozen --extra semgrep --extra ui --extra api --dev --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/agentscan-audit-requirements.txt"
          uvx --from pip-audit==2.10.1 pip-audit --strict --require-hashes --disable-pip --no-deps --desc on --requirement "$RUNNER_TEMP/agentscan-audit-requirements.txt"

      - name: Build wheel and sdist
        run: uv build --no-sources

      - name: Verify clean artifact installation profiles
        run: bash .github/scripts/smoke-artifacts.sh

      - name: Upload validated distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agentscan-distributions-${{ matrix.python-version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

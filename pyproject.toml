[project]
name = "agentscan"
version = "0.1.0"
description = "Open-source security scanner for AI agents — red-teaming, exploit engine, AI dependency scanner"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Prathamesh", email = "author@agentscan.dev" }
]
keywords = [
    "security",
    "ai-agents",
    "llm-security",
    "red-teaming",
    "prompt-injection",
    "owasp-llm-top-10",
    "supply-chain",
    "vulnerability-scanner",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.0",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "jinja2>=3.1.6",
    "python-dotenv>=1.2.2",
    "networkx>=3.2",
    "websockets>=14.0",
]

[project.scripts]
agentscan = "agentscan.cli:app"

[project.urls]
Homepage = "https://github.com/PrathaMesh3056/AgentScan"
Repository = "https://github.com/PrathaMesh3056/AgentScan"
Documentation = "https://github.com/PrathaMesh3056/AgentScan#readme"
Issues = "https://github.com/PrathaMesh3056/AgentScan/issues"

[project.optional-dependencies]
deep = [
    "torch>=2.13.0",
    "transformers>=5.14.1",
]
semantic = [
    "sentence-transformers>=5.7.0",
]
browser = [
    "playwright>=1.62.0",
]
pdf = [
    "weasyprint>=69.0",
]
llm = [
    "litellm>=1.96.2",
]
ui = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]
semgrep = [
    "semgrep>=1.80.0",
]
full = [
    "agentscan[deep,semantic,browser,pdf,llm,ui,semgrep]",
]

[tool.hatch.build.targets.wheel.force-include]
"rules/ai_rules.yaml" = "agentscan/rules/ai_rules.yaml"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "mypy>=1.9",
    "ruff>=0.4",
    "pre-commit>=3.7",
    "types-PyYAML>=6.0.0",
    "pytest-cov>=6.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

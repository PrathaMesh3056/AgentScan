# Extend the default rules. The allowlist covers credential-shaped strings that
# exist only to exercise the secret scanners; they are not real credentials.
[extend]
useDefault = true

[allowlist]
description = "Intentional secret-scanner test fixtures"
paths = [
  '''(^|/)tests/fixtures/''',
  '''(^|/)tests/test_attacks/''',
  '''(^|/)tests/test_e2e\.py$''',
]
# Fake EdDSA canary used only as a bearer value in
# tests/test_gateway/test_gateway_phase5_upstream.py. Matching the literal
# signature marker keeps the rest of that test file scannable.
regexes = [
  '''gw-canary-signature''',
]

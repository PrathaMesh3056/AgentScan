<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="100%" height="480" fill="none">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- AgentScan Cyan-Teal Gradient -->
    <linearGradient id="agentScanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Benchmark Bar Gradient -->
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #F8FAFC; letter-spacing: 1px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 400; fill: #94A3B8; }
    .axis-label { font-family: 'JetBrains Mono', monospace, sans-serif; font-size: 11px; font-weight: 500; fill: #64748B; }
    .tool-name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #F1F5F9; }
    .tool-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #94A3B8; }
    .time-val { font-family: 'JetBrains Mono', monospace, sans-serif; font-size: 12px; font-weight: 700; fill: #E2E8F0; }
    .time-lead { font-family: 'JetBrains Mono', monospace, sans-serif; font-size: 13px; font-weight: 800; fill: #38BDF8; }
    .detail-tag { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 500; fill: #CBD5E1; }
    .note-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #64748B; }
    .note-bold { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #94A3B8; }
  </style>

  <!-- Container Box -->
  <rect x="1" y="1" width="918" height="478" rx="12" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.2" />

  <!-- Header Section -->
  <text x="36" y="38" class="title">EVALUATION ARCHITECTURE LATENCY COMPARISON (100+ PROBE SUITE)</text>
  <text x="36" y="58" class="subtitle">Estimated wall-clock duration by evaluation architecture • Target: Localhost HTTP agent endpoint • Lower is better</text>

  <!-- Header Line -->
  <line x1="36" y1="74" x2="884" y2="74" stroke="#1E293B" stroke-width="1.2" />

  <!-- X-Axis Gridlines (Scale: 0 to 2000s, 480px total width from x=280 to x=760) -->
  <!-- 0s = 280, 500s = 400, 1000s = 520, 1500s = 640, 2000s = 760 -->
  <g opacity="0.6">
    <line x1="280" y1="90" x2="280" y2="390" stroke="#1E293B" stroke-dasharray="3 3" />
    <text x="280" y="405" class="axis-label" text-anchor="middle">0s</text>

    <line x1="400" y1="90" x2="400" y2="390" stroke="#1E293B" stroke-dasharray="3 3" />
    <text x="400" y="405" class="axis-label" text-anchor="middle">500s</text>

    <line x1="520" y1="90" x2="520" y2="390" stroke="#1E293B" stroke-dasharray="3 3" />
    <text x="520" y="405" class="axis-label" text-anchor="middle">1000s</text>

    <line x1="640" y1="90" x2="640" y2="390" stroke="#1E293B" stroke-dasharray="3 3" />
    <text x="640" y="405" class="axis-label" text-anchor="middle">1500s</text>

    <line x1="760" y1="90" x2="760" y2="390" stroke="#1E293B" stroke-dasharray="3 3" />
    <text x="760" y="405" class="axis-label" text-anchor="middle">2000s</text>
  </g>

  <!-- Row 1: AgentScan -->
  <text x="36" y="116" class="tool-name">AgentScan</text>
  <text x="36" y="132" class="tool-desc">In-process async heuristics</text>
  <!-- Bar: ~2.1s (represented as 6px min width) -->
  <rect x="280" y="106" width="8" height="24" rx="4" fill="url(#agentScanGrad)" />
  <text x="296" y="123" class="time-lead">~2.1s</text>
  <text x="375" y="123" class="detail-tag">Target-bounded (non-blocking asyncio; no external judge API)</text>

  <!-- Row 2: DeepEval / DeepTeam -->
  <text x="36" y="174" class="tool-name">DeepEval / DeepTeam</text>
  <text x="36" y="190" class="tool-desc">Threaded + cloud judge</text>
  <!-- Bar: 650s = 156px -->
  <rect x="280" y="164" width="156" height="22" rx="4" fill="url(#barGrad)" />
  <text x="444" y="180" class="time-val">~650s (11m)</text>
  <text x="546" y="180" class="detail-tag">Cloud LLM judge per test (GPT-4o)</text>

  <!-- Row 3: Promptfoo Redteam -->
  <text x="36" y="232" class="tool-name">Promptfoo (Redteam)</text>
  <text x="36" y="248" class="tool-desc">Concurrent Node.js + judge</text>
  <!-- Bar: 840s = 201px -->
  <rect x="280" y="222" width="201" height="22" rx="4" fill="url(#barGrad)" />
  <text x="489" y="238" class="time-val">~840s (14m)</text>
  <text x="591" y="238" class="detail-tag">Synthesizer + cloud judge assertions</text>

  <!-- Row 4: PyRIT (Microsoft) -->
  <text x="36" y="290" class="tool-name">PyRIT (Microsoft)</text>
  <text x="36" y="306" class="tool-desc">Multi-turn red-team SDK</text>
  <!-- Bar: 1500s = 360px -->
  <rect x="280" y="280" width="360" height="22" rx="4" fill="url(#barGrad)" />
  <text x="648" y="296" class="time-val">~1,500s (25m)</text>
  <text x="758" y="296" class="detail-tag">Multi-turn loop</text>

  <!-- Row 5: Garak (NVIDIA) -->
  <text x="36" y="348" class="tool-name">Garak (NVIDIA)</text>
  <text x="36" y="364" class="tool-desc">Sequential probe runner</text>
  <!-- Bar: 1980s = 475px -->
  <rect x="280" y="338" width="475" height="22" rx="4" fill="url(#barGrad)" />
  <text x="763" y="354" class="time-val">~1,980s (33m)</text>

  <!-- Footer Divider -->
  <line x1="36" y1="422" x2="884" y2="422" stroke="#1E293B" stroke-width="1.2" />

  <!-- Footer Notes -->
  <text x="36" y="444" class="note-text">
    <tspan class="note-bold">Methodology Note:</tspan> Testbed: Python 3.12, x86_64, localhost HTTP target. Cloud judge durations modeled on 200–400 API requests at ~1.5s p50 latency.
  </text>
  <text x="36" y="460" class="note-text">
    Benchmarks are illustrative and vary based on target response latency, model size, network throughput, and judge model selection.
  </text>
</svg>

[project]
name = "agentscan"
version = "0.2.0"
description = "Open-source security scanner for AI agents — red-teaming, exploit engine, AI dependency scanner"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Prathamesh", email = "author@agentscan.dev" }
]
keywords = [
    "security",
    "ai-agents",
    "llm-security",
    "red-teaming",
    "prompt-injection",
    "owasp-llm-top-10",
    "supply-chain",
    "vulnerability-scanner",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "httpcore>=1.0.9,<2",
    "cvss>=3.6,<4",
    "packaging>=24.0",
    "typer>=0.12",
    "rich>=13.0",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "jinja2>=3.1.6",
    "python-dotenv>=1.2.2",
    "networkx>=3.2",
    "websockets>=14.0",
]

[project.scripts]
agentscan = "agentscan.cli:app"

[project.urls]
Homepage = "https://github.com/PrathaMesh3056/AgentScan"
Repository = "https://github.com/PrathaMesh3056/AgentScan"
Documentation = "https://github.com/PrathaMesh3056/AgentScan#readme"
Issues = "https://github.com/PrathaMesh3056/AgentScan/issues"

[project.optional-dependencies]
deep = [
    "torch>=2.1.0",
    "transformers>=4.40.0",
]
semantic = [
    "sentence-transformers>=5.7.0",
]
browser = [
    "playwright>=1.62.0",
]
pdf = [
    "weasyprint>=69.0",
]
# Kept as an installation compatibility alias. Local analysis uses HTTPX;
# external provider SDKs are intentionally excluded.
llm = []
ui = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]
semgrep = [
    "semgrep>=1.179.0",
]
api = [
    "redis[hiredis]>=5.0",
    "asyncpg>=0.29",
    "cryptography>=43.0.0",
    "pyjwt[crypto]>=2.15.1",
    "passlib[bcrypt]>=1.7",
    "sse-starlette>=2.1",
]
telemetry = [
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-instrumentation-httpx>=0.46b0",
    "prometheus-client>=0.20.0",
]
full = [
    "agentscan[deep,semantic,browser,pdf,llm,ui,semgrep,api,telemetry]",
]

# Shared exclusions also protect a direct wheel build from local credentials,
# profiles and unfinished repair files nested inside the runtime package.
[tool.hatch.build]
exclude = [
    "**/.env",
    "**/.env.*",
    "**/*.pem",
    "**/*.key",
    "**/*.p12",
    "**/*.pfx",
    "**/.agentscan/**",
    "**/.agentscan-recovery/**",
    "**/.agentscan-fix-*",
    "**/.agentscan-recover-*",
    "**/.agentscan-rollback-*",
    "**/Codex audit/**",
    "**/AUDIT_PHASE2.md",
    "**/internal_docs/**",
    "**/.test-tmp/**",
    "**/id_rsa",
    "**/id_ed25519",
    "**/__pycache__/**",
    "**/*.pyc",
]

[tool.hatch.build.targets.wheel.force-include]
"rules/ai_rules.yaml" = "agentscan/rules/ai_rules.yaml"

# A source distribution contains only installation inputs. Hatch additionally
# supplies PKG-INFO and the root .gitignore needed for reproducible rebuilding.
[tool.hatch.build.targets.sdist]
include = [
    "/agentscan/**",
    "/rules/ai_rules.yaml",
    "/pyproject.toml",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "mypy>=1.9",
    "ruff>=0.4",
    "pre-commit>=3.7",
    "types-PyYAML>=6.0.0",
    "pytest-cov>=6.0",
    "pytest-benchmark>=4.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "redis[hiredis]>=5.0",
    "asyncpg>=0.29",
    "cryptography>=43.0.0",
    "pyjwt[crypto]>=2.15.1",
    "passlib[bcrypt]>=1.7",
    "sse-starlette>=2.1",
    "fakeredis>=2.26",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "prometheus-client>=0.20.0",
    "graphifyy>=0.9.69",
    "radon>=6.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

# Security floors for transitive dependencies used by the locked CI profile.
[tool.uv]
constraint-dependencies = [
    "anyio>=4.14.2",
    "certifi>=2024.7.4",
    "pygments>=2.20.0",
    "requests>=2.33.0",
    "urllib3>=2.8.0",
    "virtualenv>=21.7.13",
]
# Semgrep pins vulnerable mcp==1.29.0; replace only that pin for CVE-2026-59951.
# uv-only: remove when upstream Semgrep accepts the patched 1.x SDK.
override-dependencies = ["mcp>=1.30.0,<2"]

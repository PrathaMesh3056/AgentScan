name: 'AgentScan Security Scanner'
description: 'Automated AI agent security scanning, red-teaming, supply chain auditing, and SARIF reporting.'
author: 'AgentScan'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  command:
    description: 'Command to run: "audit" or "scan"'
    required: false
    default: 'audit'
  path:
    description: 'Path or directory to audit (for audit command)'
    required: false
    default: '.'
  target-url:
    description: 'Target endpoint URL (for scan command)'
    required: false
    default: ''
  fail-on:
    description: 'Exit with code 1 if findings meet or exceed severity (CRITICAL, HIGH, MEDIUM, LOW)'
    required: false
    default: 'CRITICAL'
  sarif-output:
    description: 'Path to output SARIF 2.1.0 report for GitHub Security Code Scanning tab'
    required: false
    default: 'agentscan-results.sarif'
  json-output:
    description: 'Path to output JSON findings'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
      with:
        enable-cache: true
        version: '0.12.3'

    - name: Install AgentScan
      shell: bash
      env:
        AGENTSCAN_ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        uv pip install --system "$AGENTSCAN_ACTION_PATH"

    - name: Execute AgentScan
      shell: bash
      env:
        AGENTSCAN_ACTION_PATH: ${{ github.action_path }}
        AGENTSCAN_COMMAND: ${{ inputs.command }}
        AGENTSCAN_PATH: ${{ inputs.path }}
        AGENTSCAN_TARGET_URL: ${{ inputs.target-url }}
        AGENTSCAN_FAIL_ON: ${{ inputs.fail-on }}
        AGENTSCAN_SARIF_OUTPUT: ${{ inputs.sarif-output }}
        AGENTSCAN_JSON_OUTPUT: ${{ inputs.json-output }}
      run: |
        bash "$AGENTSCAN_ACTION_PATH/.github/scripts/run-action.sh"

name: AgentScan
description: Scan an AI agent endpoint (scan-only by default; no torch unless deep=true)
author: AgentScan

inputs:
  target:
    description: Target URL (http/https, ws/wss, mcp://stdio, mcp+sse://)
    required: true
  fail-on:
    description: Exit 1 if any finding is at or above this severity
    required: false
    default: HIGH
  exploit:
    description: Also run EXPLOIT modules (true/false)
    required: false
    default: "false"
  deep:
    description: Install torch/transformers and run DEEP neural probes (true/false)
    required: false
    default: "false"
  output:
    description: Report path (extension selects json/html/pdf/sarif)
    required: false
    default: agentscan-report.json

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install AgentScan (scan-only, no torch)
      if: ${{ inputs.deep != 'true' }}
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install \
          "pydantic>=2.0" "httpx>=0.27" "typer[all]>=0.12" "rich>=13.0" \
          "pyyaml>=6.0" "loguru>=0.7" "jinja2>=3.1.6" "python-dotenv>=1.2.2" \
          "networkx>=3.2" "websockets>=14.0"
        python -m pip install --no-deps "${{ github.action_path }}"

    - name: Install AgentScan (full DEEP stack)
      if: ${{ inputs.deep == 'true' }}
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install "${{ github.action_path }}"

    - name: Run AgentScan
      shell: bash
      run: |
        EXTRA=()
        if [ "${{ inputs.exploit }}" = "true" ]; then EXTRA+=(--exploit); fi
        if [ "${{ inputs.deep }}" = "true" ]; then EXTRA+=(--deep); fi
        agentscan scan "${{ inputs.target }}" \
          "${EXTRA[@]}" \
          --fail-on "${{ inputs.fail-on }}" \
          --output "${{ inputs.output }}"

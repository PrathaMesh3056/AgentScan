# deploy/k8s/secrets-template.yaml
# Copy to secrets.yaml, fill in values, apply with: kubectl apply -f secrets.yaml
# DO NOT commit secrets.yaml to version control.
apiVersion: v1
kind: Secret
metadata:
  name: agentscan-secrets
type: Opaque
stringData:
  redis-url: "redis://redis-service:6379/0"
  database-url: "postgresql://agentscan:CHANGE_ME@postgres-service:5432/agentscan"
  # Paste an operator-generated Ed25519 PKCS8 PEM key, shared by API replicas.
  # An empty key deliberately fails startup; no development fallback exists.
  jwt-private-key: ""
  # Leave {} to disable /token. Each enrolled tenant needs its own random secret.
  tenant-credentials-json: '{}'
  allowed-target-hosts: ""
  openai-api-key: ""
  anthropic-api-key: ""
  # Optional analysis credentials; external mode still requires tenant opt-in
  # and an explicit non-sensitive designation for each scan.
  gemini-api-key: ""
  external-model: ""

  # Exact origins and private CIDRs for each enrolled tenant; {} fails startup.
  tenant-policies-json: '{}'
  # Generate a Fernet key locally; persist it with backups and mount as a file.
  data-encryption-key: ""

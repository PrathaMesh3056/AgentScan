name: 'AgentScan Security Scanner'
description: 'Automated AI agent security scanning, red-teaming, supply chain auditing, and SARIF reporting.'
author: 'AgentScan'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  command:
    description: 'Command to run: "audit" or "scan"'
    required: false
    default: 'audit'
  path:
    description: 'Path or directory to audit (for audit command)'
    required: false
    default: '.'
  target-url:
    description: 'Target endpoint URL (for scan command)'
    required: false
    default: ''
  fail-on:
    description: 'Exit with code 1 if findings meet or exceed severity (CRITICAL, HIGH, MEDIUM, LOW)'
    required: false
    default: 'CRITICAL'
  sarif-output:
    description: 'Path to output SARIF 2.1.0 report for GitHub Security Code Scanning tab'
    required: false
    default: 'agentscan-results.sarif'
  json-output:
    description: 'Path to output JSON findings'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true

    - name: Install AgentScan
      shell: bash
      run: |
        uv pip install --system "${{ github.action_path }}"

    - name: Execute AgentScan Audit
      if: ${{ inputs.command == 'audit' }}
      shell: bash
      run: |
        CMD_ARGS="${{ inputs.path }}"
        if [ -n "${{ inputs.fail-on }}" ]; then
          CMD_ARGS="$CMD_ARGS --fail-on ${{ inputs.fail-on }}"
        fi
        if [ -n "${{ inputs.sarif-output }}" ]; then
          CMD_ARGS="$CMD_ARGS --output ${{ inputs.sarif-output }}"
        elif [ -n "${{ inputs.json-output }}" ]; then
          CMD_ARGS="$CMD_ARGS --output ${{ inputs.json-output }}"
        fi
        agentscan audit $CMD_ARGS

    - name: Execute AgentScan Scan
      if: ${{ inputs.command == 'scan' }}
      shell: bash
      run: |
        CMD_ARGS="${{ inputs.target-url }}"
        if [ -n "${{ inputs.fail-on }}" ]; then
          CMD_ARGS="$CMD_ARGS --fail-on ${{ inputs.fail-on }}"
        fi
        if [ -n "${{ inputs.sarif-output }}" ]; then
          CMD_ARGS="$CMD_ARGS --output ${{ inputs.sarif-output }}"
        elif [ -n "${{ inputs.json-output }}" ]; then
          CMD_ARGS="$CMD_ARGS --output ${{ inputs.json-output }}"
        fi
        agentscan scan $CMD_ARGS

# agentscan/supply_chain/known_vulnerabilities.yaml
#
# Bundled offline vulnerability database for the AI Supply Chain Scanner.
# Supports exact-pin matching and version-range matching via packaging.specifiers.
#
# Fields:
#   package      — normalised PyPI name (lowercase, hyphens)
#   bad_version  — representative vulnerable version for exact and range checks
#   cve_id       — CVE identifier
#   severity     — CRITICAL | HIGH | MEDIUM | LOW
#   fix_version  — first safe version
#   description  — one-line human summary of the vulnerability

vulnerabilities:
  - package: langchain
    bad_version: "0.0.154"
    cve_id: CVE-2023-34541
    severity: CRITICAL
    fix_version: "0.0.155"
    description: >
      Arbitrary code execution via eval() in LLMMathChain and similar chains.
      An attacker controlling the LLM response can run arbitrary Python code
      on the host machine.

  - package: langchain
    bad_version: "0.1.16"
    cve_id: CVE-2024-21513
    severity: CRITICAL
    fix_version: "0.1.17"
    description: >
      Arbitrary code execution via unsafe code execution chains and unsafe eval
      in expression evaluation components.

  - package: transformers
    bad_version: "4.29.0"
    cve_id: CVE-2023-7018
    severity: HIGH
    fix_version: "4.30.0"
    description: >
      Unsafe deserialization in from_pretrained() when loading untrusted
      model weights via pickle. Allows arbitrary code execution.

  - package: transformers
    bad_version: "4.37.2"
    cve_id: CVE-2024-3568
    severity: HIGH
    fix_version: "4.38.0"
    description: >
      Arbitrary code execution via unsafe deserialization during model loading
      and checkpoint parsing.

  - package: huggingface-hub
    bad_version: "0.20.3"
    cve_id: CVE-2024-3568
    severity: HIGH
    fix_version: "0.21.0"
    description: >
      Path traversal vulnerability allowing malicious repositories to overwrite
      files outside the target cache directory during snapshot downloads.

  - package: chromadb
    bad_version: "0.3.22"
    cve_id: CVE-2023-48022
    severity: CRITICAL
    fix_version: "0.4.0"
    description: >
      Unauthenticated API endpoints in the Chroma HTTP server allow any
      network client to read, write, and delete all collections and documents.

  - package: llama-index
    bad_version: "0.8.5"
    cve_id: CVE-2023-43793
    severity: HIGH
    fix_version: "0.8.6"
    description: >
      Prompt injection via untrusted document content in SimpleDirectoryReader.
      Malicious documents can hijack the agent's reasoning chain.

  - package: openai
    bad_version: "0.27.0"
    cve_id: CVE-2023-51736
    severity: MEDIUM
    fix_version: "1.0.0"
    description: >
      Deprecated library version with known API surface issues; lacks
      certificate validation improvements present in v1+.

  - package: langchain-community
    bad_version: "0.0.1"
    cve_id: CVE-2024-2965
    severity: HIGH
    fix_version: "0.0.20"
    description: >
      SQLDatabaseChain allows SQL injection via unsanitised LLM output
      when construct_examples is enabled.

  - package: gradio
    bad_version: "4.18.0"
    cve_id: CVE-2024-1561
    severity: CRITICAL
    fix_version: "4.19.0"
    description: >
      Local File Inclusion (LFI) allowing unauthenticated attackers to read
      arbitrary files from the host server filesystem.

  - package: llama-cpp-python
    bad_version: "0.2.25"
    cve_id: CVE-2024-34359
    severity: CRITICAL
    fix_version: "0.2.26"
    description: >
      Remote Code Execution (RCE) via Jinja template injection in GGUF
      chat-template metadata handling.

  - package: litellm
    bad_version: "1.27.14"
    cve_id: CVE-2024-39701
    severity: HIGH
    fix_version: "1.28.0"
    description: >
      Sensitive credential leakage where upstream provider API keys and
      authorization tokens are exposed in debug logging streams.

  - package: python-multipart
    bad_version: "0.0.17"
    cve_id: CVE-2024-24762
    severity: HIGH
    fix_version: "0.0.18"
    description: >
      Regular Expression Denial of Service (ReDoS) vulnerability in multipart
      boundary and header parsing routines.

  - package: onnx
    bad_version: "1.15.0"
    cve_id: CVE-2024-27318
    severity: HIGH
    fix_version: "1.16.0"
    description: >
      Path traversal vulnerability in ONNX external data loader allowing
      arbitrary file overwrite during model loading.

  - package: torch
    bad_version: "2.1.2"
    cve_id: CVE-2024-27758
    severity: HIGH
    fix_version: "2.2.0"
    description: >
      Unsafe deserialization in torch.load allowing arbitrary code execution
      when loading untrusted PyTorch weights or model checkpoints.
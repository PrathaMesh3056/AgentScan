# .pre-commit-config.yaml
#
# Pre-commit hooks run automatically before every git commit.
# If any hook fails, the commit is blocked until you fix the issue.
#
# Install once with: pre-commit install
# Run manually:      pre-commit run --all-files

repos:
  # ── Ruff: lint + format (replaces flake8 + black + isort) ──────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep this revision equal to the Ruff version in uv.lock.
    rev: v0.15.8
    hooks:
      - id: ruff-check
        name: ruff lint
        args: [--fix]          # auto-fix safe issues
      - id: ruff-format
        name: ruff format      # auto-format (like black)

  # ── Mypy: static type checking ──────────────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-mypy
    # PEP 695 syntax requires the current checker used by locked CI.
    rev: v1.19.1
    hooks:
      - id: mypy
        name: mypy type check
        # Check the whole runtime, including modules not staged in this commit.
        pass_filenames: false
        always_run: true
        additional_dependencies:
          # Match the directly typed support dependencies in uv.lock.
          - pydantic==2.12.5
          - httpx==0.28.1
          - types-pyyaml==6.0.12.20260518
          # Redis ships its own types; the legacy stubs hide modern aclose().
          - redis==8.1.0
        args: [agentscan]

  # ── General file hygiene ────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace   # remove trailing spaces
        args: [--markdown-linebreak-ext=md]  # preserve Markdown hard line breaks

      - id: check-yaml            # validate YAML syntax
        args: [--allow-multiple-documents]
      - id: check-toml            # validate TOML syntax
      - id: check-merge-conflict  # block accidental merge conflict markers
      - id: debug-statements      # block accidental print() / breakpoint()

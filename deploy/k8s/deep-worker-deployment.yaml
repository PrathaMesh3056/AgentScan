# Optional CPU DEEP pool. Requires the verified Dockerfile.deep image, a
# provisioned read-only pinned model cache, and the KEDA CRD/operator.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentscan-deep-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agentscan-deep-worker
  template:
    metadata:
      labels:
        app: agentscan-deep-worker
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agentscan-deep-worker
          image: agentscan-deep@sha256:REPLACE_WITH_VERIFIED_RELEASE_DIGEST
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command: ["agentscan", "api", "worker"]
          env:
            - name: AGENTSCAN_DEEP_WORKER
              value: "true"
            - name: WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: AGENTSCAN_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: agentscan-secrets
                  key: redis-url
            - name: AGENTSCAN_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agentscan-secrets
                  key: database-url
            - name: AGENTSCAN_ALLOWED_TARGET_HOSTS
              valueFrom:
                secretKeyRef:
                  name: agentscan-secrets
                  key: allowed-target-hosts
            - name: AGENTSCAN_TENANT_POLICIES_JSON
              valueFrom:
                secretKeyRef:
                  name: agentscan-secrets
                  key: tenant-policies-json
            - name: AGENTSCAN_DATA_KEY_FILE
              value: /run/secrets/agentscan/data-encryption-key
            - name: AGENTSCAN_RETENTION_DAYS
              value: "7"
            - name: AGENTSCAN_WORKER_LEASE_SECONDS
              value: "60"
            - name: AGENTSCAN_WORKER_MAX_ATTEMPTS
              value: "3"
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: HF_HOME
              value: /models/huggingface
          volumeMounts:
            - name: service-data
              mountPath: /run/secrets/agentscan
              readOnly: true
            - name: model-cache
              mountPath: /models
              readOnly: true
          resources:
            requests:
              cpu: "1"
              memory: "3Gi"
            limits:
              cpu: "2"
              memory: "6Gi"
      volumes:
        - name: service-data
          secret:
            secretName: agentscan-secrets
            defaultMode: 0440
            items:
              - key: data-encryption-key
                path: data-encryption-key
        - name: model-cache
          persistentVolumeClaim:
            # Replace with an operator-provisioned model-cache PVC.
            claimName: replace-with-pinned-model-cache-pvc

---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: agentscan-deep-worker-scaler
spec:
  scaleTargetRef:
    name: agentscan-deep-worker
  minReplicaCount: 0
  maxReplicaCount: 4
  triggers:
    - type: redis-streams
      metadata:
        address: redis-service:6379
        stream: agentscan:scan:deep
        consumerGroup: agentscan-workers
        lagCount: "1"
      authenticationRef:
        name: agentscan-redis-scaler-auth

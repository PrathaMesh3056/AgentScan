name: Validate source and release artifacts

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      PYTHON_VERSION: ${{ matrix.python-version }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          version: "0.12.3"

      - name: Set up Python
        run: uv python install "$PYTHON_VERSION"

      - name: Install locked validation dependencies
        run: uv sync --locked --python "$PYTHON_VERSION" --extra semgrep --extra ui --extra api --extra gateway --dev

      - name: Run pre-commit hooks
        run: uv run --no-sync pre-commit run --all-files --show-diff-on-failure
      - name: Run Ruff linter and formatting
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .

      - name: Run Mypy type checking
        run: uv run --no-sync mypy agentscan

      # Branch-aware: a policy or receipt branch that no test reaches is a security
      # regression even when every statement still runs. Measured on the base commit:
      # policy 83%, receipts 85%. Each floor sits two points lower so an unrelated
      # change cannot trip it, while a dropped branch fails the job.
      - name: Gateway policy and receipt branch coverage floors
        run: |
          uv run --no-sync pytest tests/test_gateway -q -m "not slow" --cov=agentscan.gateway.policy --cov-branch --cov-report=term-missing --cov-fail-under=81
          uv run --no-sync pytest tests/test_gateway -q -m "not slow" --cov=agentscan.gateway.receipts --cov-branch --cov-report=term-missing --cov-fail-under=83

      # Crash-safe remediation is a critical path: a recovery journal that no test
      # reaches is where an interrupted fix silently eats an editor's changes.
      # Measured 97% on the base commit after the in-process journal tests.
      - name: Remediation recovery branch coverage floor
        run: uv run --no-sync pytest tests/test_remediation -q -m "not slow" --cov=agentscan.remediation.recovery --cov-branch --cov-report=term-missing --cov-fail-under=95

      - name: Gateway CLI smoke
        run: uv run --no-sync agentscan-gateway --help

      # Statement coverage hid half-tested control flow; the suite measures 82% with
      # branch coverage on the base commit, so the floor leaves two points of slack.
      - name: Run tests and action boundary regressions (branch coverage)
        run: uv run --no-sync pytest tests .github/tests -m "not slow" --cov=agentscan --cov-branch --cov-report=xml --cov-fail-under=80

      - name: Audit locked dependencies (required)
        run: |
          set -euo pipefail
          uv export --frozen --extra semgrep --extra ui --extra api --extra gateway --dev --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/agentscan-audit-requirements.txt"
          uvx --from pip-audit==2.10.1 pip-audit --strict --require-hashes --disable-pip --no-deps --desc on --requirement "$RUNNER_TEMP/agentscan-audit-requirements.txt"

      - name: Build wheel and sdist
        run: uv build --no-sources

      - name: Verify clean artifact installation profiles
        run: bash .github/scripts/smoke-artifacts.sh

      - name: Upload validated distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agentscan-distributions-${{ matrix.python-version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          version: "0.12.3"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install locked validation dependencies
        run: uv sync --locked --python 3.12 --dev --extra gateway

      - name: Verify frozen benchmark inputs on Windows
        run: uv run --no-sync pytest tests/test_frozen_benchmark_digests.py -q

      - name: Run gateway tests on Windows
        run: uv run --no-sync pytest tests/test_gateway -q

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"

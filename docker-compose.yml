services:
  agentscan-ui:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["ui", "--host", "0.0.0.0", "--port", "8765"]
    ports:
      - "8765:8765"
    volumes:
      - ./reports:/workspace/reports
      - ./manifests:/workspace/manifests
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

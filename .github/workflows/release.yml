name: Release & Publish

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  pull-requests: read

jobs:
  validation:
    uses: ./.github/workflows/validate.yml

  publish:
    needs: validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write  # Mandatory for PyPI Trusted Publishing
      contents: write  # Mandatory for GitHub Releases

    steps:
      - name: Download validated distributions from this workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agentscan-distributions-3.12
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/
